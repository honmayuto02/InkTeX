<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#1e293b"/>
  
  <!-- Serif T -->
  <text x="140" y="350" font-family="serif" font-size="300" fill="#94a3b8" font-weight="bold">T</text>
  <!-- Serif e -->
  <text x="280" y="350" font-family="serif" font-size="200" fill="#94a3b8" font-weight="bold">e</text>
  
  <!-- Handwritten X (Overlay) -->
  <path d="M360 200 C 360 200, 400 250, 480 350 M 480 200 C 480 200, 420 280, 360 350" stroke="#facc15" stroke-width="25" stroke-linecap="round" fill="none" filter="url(#glow)"/>
</svg>
